<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Employee List</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="header">
    Employee Management System
</div>

<div class="search-box">
    <input type="text" id="search" placeholder="Search employee name...">

    <div>
        <button onclick="openForm()">Add</button>
        <button onclick="loadData()">Reload</button>
    </div>
</div>

<table>
    <thead>
    <tr>
        <th>Mã nhân viên</th>
        <th>Tên nhân viên</th>
        <th>Lý do nghỉ</th>
        <th>Số ngày nghỉ</th>
    </tr>
    </thead>

    <tbody id="tbody"></tbody>
</table>

<div id="formBox" style="display:none; width:90%; margin:20px auto; background:white; padding:15px; border-radius:8px;">

    <h3>Add Employee</h3>

    <input id="maNV" placeholder="MaNV"><br><br>
    <input id="tenNV" placeholder="TenNV"><br><br>
    <input id="lidoNghi" placeholder="Ly do nghi"><br><br>
    <input id="soNgayNghi" placeholder="So ngay nghi"><br><br>

    <button onclick="addEmployee()">Save</button>
    <button onclick="closeForm()">Close</button>

</div>

<div class="pagination">

    <button id="prevBtn" onclick="prevPage()">
        ← Prev
    </button>

    <span id="pageNumber">Page 1</span>

    <button id="nextBtn" onclick="nextPage()">
        Next →
    </button>

</div>

<!-- JS -->
<script src="js/app.js"></script>

</body>
</html>
